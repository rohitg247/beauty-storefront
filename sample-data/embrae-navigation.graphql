# ===========================================================================
# STEP 5 — Footer column: SUPPORT
#
# Shipping and Returns point at Shopify policy URLs. They resolve as soon as
# the policies are written in Settings -> Policies, and 404 until then.
# ===========================================================================
mutation Step5_CreateFooterSupport {
  menuCreate(
    title: "Footer - Support"
    handle: "footer-support"
    items: [
      { title: "FAQ Center", type: HTTP, url: "/pages/faq" }
      { title: "Shipping", type: HTTP, url: "/policies/shipping-policy" }
      { title: "Returns", type: HTTP, url: "/policies/refund-policy" }
      { title: "Track Order", type: HTTP, url: "/pages/track-order" }
      { title: "Contact Us", type: HTTP, url: "/pages/contact" }
    ]
  ) {
    menu {
      id
      handle
    }
    userErrors {
      field
      message
      code
    }
  }
}


# ===========================================================================
# STEP 6 — Footer column: CONNECT
#
# ALL FIVE OF THESE ARE PLACEHOLDERS. Replace them in Admin -> Content -> Menus
# with the real profile URLs, a mailto: address and a wa.me link. They point at
# the platform home pages rather than at nothing, so the footer is never broken
# while you gather them, but they are not useful links until you do.
# ===========================================================================
mutation Step6_CreateFooterConnect {
  menuCreate(
    title: "Footer - Connect"
    handle: "footer-connect"
    items: [
      { title: "Instagram", type: HTTP, url: "https://www.instagram.com/" }
      { title: "YouTube", type: HTTP, url: "https://www.youtube.com/" }
      { title: "Facebook", type: HTTP, url: "https://www.facebook.com/" }
      { title: "Email", type: HTTP, url: "/pages/contact" }
      { title: "WhatsApp", type: HTTP, url: "/pages/contact" }
    ]
  ) {
    menu {
      id
      handle
    }
    userErrors {
      field
      message
      code
    }
  }
}


# ===========================================================================
# STEP 7 — Verify
# ===========================================================================
query Step7_VerifyMenus {
  menus(first: 20) {
    nodes {
      id
      handle
      title
      # `itemsCount` does not exist on Menu in API 2026-07 and its presence here
      # failed validation for the WHOLE document, silently blocking all six
      # mutations above. Count the returned items instead.
      items {
        title
        items { title }
      }
    }
  }
}
